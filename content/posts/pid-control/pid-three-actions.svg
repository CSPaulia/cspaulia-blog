<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Three PID actions explained with cruise control</title>
  <desc id="desc">Proportional action responds to the current speed gap, integral action accumulates a persistent small gap, and derivative action backs off when speed approaches the target rapidly.</desc>
  <defs>
    <style>
      .text { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; }
      .head { font-size: 27px; font-weight: 700; }
      .body { font-size: 20px; }
      .value { font-size: 38px; font-weight: 700; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .blue { stroke: #2563eb; fill: none; stroke-width: 7; stroke-linecap: round; }
      .orange { stroke: #ea580c; fill: none; stroke-width: 7; stroke-linecap: round; }
      .green { stroke: #15803d; fill: none; stroke-width: 7; stroke-linecap: round; }
      .guide { stroke: #64748b; fill: none; stroke-width: 2; stroke-dasharray: 8 7; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect width="1200" height="540" fill="#ffffff"/>
  <text class="text title" x="600" y="48" text-anchor="middle">汽车定速中的三个判断 / Three decisions in cruise control</text>

  <rect class="panel" x="32" y="82" width="356" height="420" rx="20"/>
  <rect class="panel" x="422" y="82" width="356" height="420" rx="20"/>
  <rect class="panel" x="812" y="82" width="356" height="420" rx="20"/>

  <text class="text head" x="210" y="128" text-anchor="middle">P · 当前误差</text>
  <text class="text body" x="210" y="157" text-anchor="middle">Present error</text>
  <path d="M 105 282 A 105 105 0 0 1 315 282" class="blue"/>
  <line x1="210" y1="282" x2="162" y2="214" class="blue" marker-end="url(#arrow-blue)"/>
  <circle cx="210" cy="282" r="10" fill="#2563eb"/>
  <text class="text value" x="210" y="340" text-anchor="middle">40 → 60</text>
  <text class="text body" x="210" y="391" text-anchor="middle">差得越多，给油越多</text>
  <text class="text body" x="210" y="424" text-anchor="middle">Larger gap → more throttle</text>

  <text class="text head" x="600" y="128" text-anchor="middle">I · 累积误差</text>
  <text class="text body" x="600" y="157" text-anchor="middle">Accumulated error</text>
  <rect x="462" y="203" width="72" height="72" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <rect x="564" y="203" width="72" height="72" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <rect x="666" y="203" width="72" height="72" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text class="text value" x="498" y="252" text-anchor="middle">58</text>
  <text class="text value" x="600" y="252" text-anchor="middle">58</text>
  <text class="text value" x="702" y="252" text-anchor="middle">58</text>
  <path d="M 482 310 L 718 310" class="orange"/>
  <text class="text value" x="600" y="364" text-anchor="middle">2 + 2 + 2 + …</text>
  <text class="text body" x="600" y="411" text-anchor="middle">一直差一点，就逐渐补足</text>
  <text class="text body" x="600" y="444" text-anchor="middle">Persistent gap → build correction</text>

  <text class="text head" x="990" y="128" text-anchor="middle">D · 变化趋势</text>
  <text class="text body" x="990" y="157" text-anchor="middle">Rate of change</text>
  <line x1="862" y1="296" x2="1128" y2="296" class="guide"/>
  <text class="text body" x="1128" y="282" text-anchor="end">目标 60</text>
  <polyline points="868,367 930,333 992,275 1054,220 1118,190" class="green" marker-end="url(#arrow-green)"/>
  <circle cx="868" cy="367" r="7" fill="#15803d"/>
  <circle cx="992" cy="275" r="7" fill="#15803d"/>
  <text class="text value" x="990" y="408" text-anchor="middle">45 → 54 → 59</text>
  <text class="text body" x="990" y="447" text-anchor="middle">接近太快，提前收油</text>
  <text class="text body" x="990" y="480" text-anchor="middle">Fast approach → back off early</text>
</svg>
