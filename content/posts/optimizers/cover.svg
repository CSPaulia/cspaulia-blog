<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">优化器：从 SGD、AdamW 到 Muon</title>
  <desc id="desc">梯度轨迹从震荡下降过渡到平滑下降，右侧展示经过正交化的矩阵。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="none" stroke="#334155" stroke-width="3" opacity="0.75">
    <ellipse cx="480" cy="500" rx="400" ry="260"/>
    <ellipse cx="480" cy="500" rx="300" ry="190"/>
    <ellipse cx="480" cy="500" rx="195" ry="120"/>
    <ellipse cx="480" cy="500" rx="90" ry="55"/>
  </g>
  <path d="M105 255 C240 720 325 190 430 650 S595 300 690 500 S760 445 800 470" fill="none" stroke="url(#path)" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="800" cy="470" r="18" fill="#a78bfa"/>
  <g transform="translate(1010 280)" fill="none" stroke="#38bdf8" stroke-width="8">
    <rect x="0" y="0" width="310" height="310" rx="22" opacity="0.35"/>
    <path d="M40 95 H270 M40 155 H270 M40 215 H270" opacity="0.75"/>
    <path d="M95 40 V270 M155 40 V270 M215 40 V270" opacity="0.75"/>
    <path d="M56 252 L252 56" stroke="#a78bfa" stroke-width="14" filter="url(#glow)"/>
  </g>
  <text x="100" y="120" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="62" font-weight="700">优化器</text>
  <text x="100" y="190" fill="#94a3b8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="34">SGD · AdamW · Muon</text>
  <text x="1010" y="680" fill="#cbd5e1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="31">逐元素缩放 → 矩阵级更新</text>
</svg>
